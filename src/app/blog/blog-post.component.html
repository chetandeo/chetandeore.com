<main class="article-page" *ngIf="post$ | async as post">
  <article>
    <header class="article-header">
      <div class="container narrow">
        <a routerLink="/blog" class="back-link">&larr; Blog</a>
        <div class="post-meta">
          <span>{{ post.publishedAt | date: 'MMMM d, y' }}</span>
          <span>{{ post.readingMinutes }} min read</span>
          <span>{{ post.author }}</span>
        </div>
        <h1>{{ post.title }}</h1>
        <p>{{ post.subtitle }}</p>

        <div class="tags" aria-label="Post tags">
          <span *ngFor="let tag of post.tags">{{ tag }}</span>
        </div>
      </div>
    </header>

    <div class="article-cover" *ngIf="post.coverImage">
      <img 
        [src]="post.coverImage" 
        [alt]="post.title" 
        (error)="onImageError($event)"
        loading="lazy"
        class="cover-image"
      />
    </div>
    <div class="article-cover-placeholder" *ngIf="!post.coverImage">
      <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </div>

    <section class="article-content">
      <div class="container narrow">
        <ng-container *ngFor="let block of post.content">
          <p *ngIf="block.type === 'paragraph'">{{ block.text }}</p>
          <h2 *ngIf="block.type === 'heading'">{{ block.text }}</h2>
          <ul *ngIf="block.type === 'list'">
            <li *ngFor="let item of block.items">{{ item }}</li>
          </ul>
        </ng-container>
      </div>
    </section>
  </article>
</main>
